# Service definitions for Trivia application
services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trivia_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app_network

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python -u manage.py migrate &&
      uvicorn api.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=api.settings
      - PGHOST=${PGHOST}
      - PGPASSWORD=${PGPASSWORD}
      - PGUSER=${PGUSER}
      - PGDATABASE=${PGDATABASE}
      - PGPORT=${PGPORT:-5432}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"

  bot:
    build: .
    restart: unless-stopped
    command: python -m bot.main
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://web:8000
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network

volumes:
  trivia_redis_data:
    driver: local
    name: trivia_redis_data

networks:
  app_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
