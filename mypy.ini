[mypy]
# Especifica la versión de Python para la verificación de tipos
python_version = 3.10

# Ignora errores cuando no se encuentran tipos en módulos importados
ignore_missing_imports = True

# Advierte cuando una función retorna implícitamente el tipo 'Any'
warn_return_any = True

# Advierte sobre secciones de configuración que no se están utilizando
warn_unused_configs = True

[mypy-*.migrations.*]
# Ignora errores de tipo en todos los archivos de migración de Django
# Ya que son generados automáticamente y no requieren verificación de tipos
ignore_errors = True

[mypy-mycode.foo.*]
# Requiere que todas las funciones en el módulo foo tengan anotaciones de tipo explícitas
# No permite funciones sin tipos definidos
disallow_untyped_defs = True

[mypy-mycode.bar]
# Desactiva las advertencias sobre retornos 'Any' específicamente para este módulo
# Más permisivo que la configuración global
warn_return_any = False
